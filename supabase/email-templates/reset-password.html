<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'FbEinstein';
      src: url('https://www.mothersday.co.il/fonts/FbEinstein-ConThin.woff2') format('woff2'),
           url('https://www.mothersday.co.il/fonts/FbEinstein-ConThin.woff') format('woff');
      font-weight: 300;
      font-style: normal;
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4ede7;font-family:'Assistant',Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4ede7;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="font-family:'Assistant',Arial,Helvetica,sans-serif;background-color:#ffffff;max-width:480px;width:100%;">
          <tr>
            <td align="center" style="padding:32px 24px 16px;">
              <img src="https://www.mothersday.co.il/logo.png" alt="יום האם" height="60" style="height:60px;" />
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 8px;">
              <h1 style="font-family:'FbEinstein','Assistant',Arial,Helvetica,sans-serif;font-weight:300;margin:0;font-size:32px;color:#683E48;">איפוס סיסמה</h1>
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:'Assistant',Arial,Helvetica,sans-serif;padding:8px 32px 28px;font-size:15px;line-height:1.7;color:#6b5b60;">
              לחצי על הכפתור למטה כדי לבחור סיסמה חדשה לחשבון שלך. הקישור תקף ל-60 דקות.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 32px 32px;">
              <a href="{{ .ConfirmationURL }}"
                 style="font-family:'Assistant',Arial,Helvetica,sans-serif;display:inline-block;padding:14px 40px;background-color:#683E48;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;">
                לבחירת סיסמה חדשה
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;">
              <hr style="border:none;border-top:1px solid #e8ddd4;margin:0;" />
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:'Assistant',Arial,Helvetica,sans-serif;padding:20px 32px 28px;font-size:12px;color:#a09090;line-height:1.7;">
              אם לא ביקשת לאפס סיסמה, ניתן להתעלם מהודעה זו.
              <br />יום האם - מתנות עם אהבה
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
